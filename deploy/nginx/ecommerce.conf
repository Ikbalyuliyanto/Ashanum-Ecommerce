# Nginx site for the Go app on the HG680P.
# Install: /etc/nginx/sites-available/ecommerce.conf, symlink into sites-enabled,
# replace example.com, then `nginx -t && systemctl reload nginx`.
#
# Cloudflare SSL/TLS mode: "Full (strict)" with a Cloudflare Origin CA cert.
# If you use Cloudflare Tunnel (cloudflared) instead of opening ports, point the
# tunnel at http://127.0.0.1:80 and keep only the port-80 server block,
# replacing its "return 301" with the location blocks below.

upstream ecommerce_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Buffered access log: fewer writes to the device's eMMC.
    access_log /var/log/nginx/ecommerce.access.log combined buffer=32k flush=1m;
    error_log  /var/log/nginx/ecommerce.error.log warn;

    client_max_body_size 10m;

    gzip              on;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Readiness reveals database state: local monitoring only.
    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://ecommerce_app;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://ecommerce_app;
    }

    # Versioned assets are cached by browsers and Cloudflare for a year.
    location /static/ {
        access_log off;
        proxy_pass http://ecommerce_app;
    }

    location / {
        proxy_pass http://ecommerce_app;
    }
}

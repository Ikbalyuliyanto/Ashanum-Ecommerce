      summary: Current payment status, verified with the provider
      security: [{ bearer: [] }]
      responses: { "200": { description: "{order_number, order_status, paid, can_pay, payment, sandbox}" } }
  /me/reviews:
    get:
      security: [{ bearer: [] }]

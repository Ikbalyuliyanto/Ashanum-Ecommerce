      responses: { "201": { description: Review, content: { application/json: { schema: { properties: { data: { $ref: "#/components/schemas/MyReview" } } } } } }, "409": { $ref: "#/components/responses/Error" } }
  /reviews/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewInput" } } } }
      responses: { "200": { description: Review }, "404": { $ref: "#/components/responses/Error" } }
  /me/returns:
    get:
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/page" }]
      responses: { "200": { description: Returns } }
  /me/returns/{return_number}:
    parameters: [{ $ref: "#/components/parameters/returnNumber" }]
    get:
      security: [{ bearer: [] }]
      responses: { "200": { description: Return, content: { application/json: { schema: { properties: { data: { $ref: "#/components/schemas/Return" } } } } } }, "404": { $ref: "#/components/responses/Error" } }
  /returns:
    post:
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReturnInput" } } } }
      responses: { "201": { description: Return }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }

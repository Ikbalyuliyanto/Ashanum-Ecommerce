{{/* Mobile tab bar on top-level pages. */}}
{{define "bottom-nav" -}}
<nav class="bottom-nav" aria-label="Navigasi bawah">
  <a class="bottom-nav__item{{if eq .Path "/"}} is-active{{end}}" href="/"{{if eq .Path "/"}} aria-current="page"{{end}}>{{icon "home"}}<span>Beranda</span></a>
  <a class="bottom-nav__item{{if hasPrefix .Path "/categories"}} is-active{{end}}" href="/categories"{{if hasPrefix .Path "/categories"}} aria-current="page"{{end}}>{{icon "grid"}}<span>Kategori</span></a>
  <a class="bottom-nav__item{{if hasPrefix .Path "/cart"}} is-active{{end}}" href="/cart">
    <span class="bottom-nav__icon">{{icon "cart"}}{{template "cart-badge" (dict "ID" "cart-badge-nav" "Count" .CartCount "OOB" false)}}</span><span>Keranjang</span></a>
  <a class="bottom-nav__item{{if hasPrefix .Path "/account/orders"}} is-active{{end}}" href="/account/orders">{{icon "receipt"}}<span>Pesanan</span></a>
  <a class="bottom-nav__item{{if eq .Path "/account"}} is-active{{end}}" href="/account"{{if eq .Path "/account"}} aria-current="page"{{end}}>{{icon "user"}}<span>Akun</span></a>
</nav>
{{- end}}

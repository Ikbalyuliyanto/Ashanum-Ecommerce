{{/* The cart icon is a placeholder until the cart phase (Phase 4). */}}
{{define "navbar" -}}
<nav class="nav" aria-label="Navigasi utama">
  <span class="nav__icon is-disabled" aria-disabled="true" title="Keranjang segera hadir" data-phase="4">{{icon "cart"}}<span class="visually-hidden">Keranjang (segera hadir)</span></span>
  {{- if .User}}
  <a class="nav__link{{if hasPrefix .Path "/account"}} is-active{{end}}" href="/account" aria-label="Akun Saya">{{icon "user"}}<span class="nav__text">Akun Saya</span></a>
  {{- else}}
  <a class="nav__link" href="/login">Masuk</a>
  <a class="nav__link nav__link--primary nav__hide-sm" href="/register">Daftar</a>
  {{- end}}
</nav>
{{- end}}
